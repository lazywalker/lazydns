# lazydns: minimal example configuration file
#
# This is a minimal "get started" config for local development.
# For more configurations, see:
#   - examples/etc/config.yaml          (full-featured, ~600 lines, heavily commented)
#   - examples/etc/config-simple.yaml   (simple working setup with cache/hosts)
#   - etc/lazydns/config.yaml            (deployment example with file logging)
#   - examples/*.demo.yaml              (one-off demos per plugin)
#
# Full documentation: https://lazywalker.github.io/lazydns/docs/

# Log configuration
log:
  level: info
  format: text
  console: true

# Plugin execution flow
plugins:
  # Forward to upstream DNS servers
  - tag: forward
    type: forward
    args:
      concurrent: 3
      upstreams:
        - addr: "8.8.8.8:53"
        - addr: "1.1.1.1:53"
        - "https://8.8.8.8/dns-query"

  # Simple sequence that forwards all queries
  - tag: main_sequence
    type: sequence
    args:
      - exec: $forward
      - exec: accept

  # UDP server listening on :5356
  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: ":5354"

  # TCP server listening on :5356
  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: ":5354"
