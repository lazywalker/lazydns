# Example configuration for DomainValidatorPlugin
# This demonstrates how to use the domain_validator plugin to filter invalid DNS queries
#
# Usage:
#   cargo run -- -c examples/domain_validator.demo.yaml -vv
#
# The domain_validator plugin validates domain names in DNS queries according to RFC 1035/1123.
# Invalid domains are rejected early, reducing upstream load and improving server robustness.
# It includes LRU caching for performance.
#
# Configuration options:
#   - strict_mode: Reject domains with consecutive hyphens (default: true)
#   - cache_size: Maximum number of domains to cache validation results (integer, default: 1000)
#
# Note: For domain blacklisting/blocking, use the domain_set + black_hole plugins instead.

# Log configuration
log:
  level: info
  format: text

# Plugin execution flow
plugins:
  # Domain validator with default settings (cache_size: 1000)
  - tag: domain_validator_default
    type: domain_validator
    args:
      cache_size: 1000

  # Domain validator with custom cache size and lenient mode
  - tag: domain_validator_lenient
    type: domain_validator
    args:
      cache_size: 500
      strict_mode: false

  # Forward to upstream DNS servers
  - tag: forward
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: "8.8.8.8:53"
        - addr: "1.1.1.1:53"

  # Arbitrary response plugin for testing valid domains
  - tag: test_response
    type: arbitrary
    args:
      rules:
        - "valid.example.com A 192.0.2.1"
        - "another.valid.com AAAA 2001:db8::1"

  # Main sequence with default domain validation
  - tag: main_sequence_with_validation
    type: sequence
    args:
      - exec: $domain_validator_default
      - exec: $test_response
      - exec: accept

  # Sequence with lenient validation
  - tag: lenient_validation_sequence
    type: sequence
    args:
      - exec: $domain_validator_lenient
      - exec: $test_response
      - exec: accept

  # UDP server with default domain validation
  - tag: udp_server_default
    type: udp_server
    args:
      entry: main_sequence_with_validation
      listen: ":5354"

  # UDP server with lenient validation
  - tag: udp_server_lenient
    type: udp_server
    args:
      entry: lenient_validation_sequence
      listen: ":5355"

  # TCP server with default domain validation
  - tag: tcp_server_default
    type: tcp_server
    args:
      entry: main_sequence_with_validation
      listen: ":5354"

  # TCP server with lenient validation
  - tag: tcp_server_lenient
    type: tcp_server
    args:
      entry: lenient_validation_sequence
      listen: ":5355"