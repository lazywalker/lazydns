[package]
name = "lazydns"
version = "0.3.25"
edition = "2024"
authors = ["lazywalker <lazywalkerz@gmail.com>"]
description = "A light and fast DNS server/forwarder implementation in Rust"
repository = "https://github.com/lazywalker/lazydns"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["dns", "doh", "doq", "dot", "smartdns"]
categories = ["network-programming"]
exclude = [
  ".dockerignore",
  ".github/",
  ".gitignore",
  "Makefile",
  "benches/",
  "config.yaml",
  "docker/",
  "docs/",
  "etc/",
  "examples/",
  "scripts/",
  "tests/",
  "webui/",
]

[package.metadata.deb]
maintainer = "lazywalker <lazywalkerz@gmail.com>"
copyright = "2025, lazywalker <lazywalkerz@gmail.com>"
license-file = ["LICENSE"]
extended-description = """\
A light and fast DNS server/forwarder implementation in Rust.
"""
section = "net"
priority = "optional"
assets = [
  # `target/release` path is special and will be replaced by cargo-deb at build time
  [
    "target/release/lazydns",
    "usr/bin/",
    "755",
  ],
  [
    "etc/lazydns/config.yaml",
    "etc/lazydns/",
    "644",
  ],
  [
    "docs/man/lazydns.1.gz",
    "usr/share/man/man1/",
    "644",
  ],
  [
    "docs/man/lazydns.5.gz",
    "usr/share/man/man5/",
    "644",
  ],
  [
    "docs/man/lazydns.8.gz",
    "usr/share/man/man8/",
    "644",
  ],
]
maintainer-scripts = "etc/systemd/"
systemd-units = { enable = true }

[workspace]
members = [".", "lazydns-macros"]

[lib]
name = "lazydns"
path = "src/lib.rs"

[[bin]]
name = "lazydns"
path = "src/main.rs"

[[example]]
name = "metrics_collector_demo"
path = "examples/metrics/metrics_collector_demo.rs"

[[example]]
name = "prometheus_metrics_collector_demo"
path = "examples/metrics/prometheus_metrics_collector_demo.rs"

[[bench]]
harness = false
name = "forward_clone"

[[bench]]
harness = false
name = "forward_concurrent"

[[bench]]
harness = false
name = "arc_str_bench"

[dependencies]
tokio = { version = "1.49", default-features = false, features = ["macros", "process", "rt", "signal"] }

# DNS protocol
hickory-proto = "0.26"

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

lazylog = { git = "https://github.com/lazywalker/lazylog", version = "0.1.6", default-features = false, optional = true }
# Logging
tracing = "0.1"

# Time crate for cron plugin
time = { version = "0.3", default-features = false, optional = true }

# cron expression parsing for cron plugin
cronexpr = { version = "1.4", optional = true }

# Async utilities
async-trait = "0.1"

# Concurrent data structures
dashmap = "6.1"
parking_lot = "0.12"

# LRU cache
lru = "0.16"

# Networking
# FIXME: connection will reset when test curl with admin features with http2
axum = { version = "0.8", default-features = false, features = ["http1", "json", "macros", "query", "tokio"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
rustls-pemfile = { version = "2.0", optional = true }
tokio-rustls = { version = "0.26", optional = true }

# QUIC / DoQ support (optional)
quinn = { version = "0.11", optional = true }

# Base64 encoding
base64 = "0.23"

# Procedural macros for plugin registration (workspace member)
lazydns-macros = { path = "lazydns-macros", version = "0.2.62" }

# Metrics
prometheus = { version = "0.14", optional = true }

# File watching for hot reload
notify = "8.2"

# CLI
pico-args = "0.5"

ipnet = "2.9"
libc = "0.2"
linkme = "0.3"
# Utilities
once_cell = "1.19"
rand = "0.10"
regex = "1.10"

async-stream = { version = "0.3", optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
# WebUI dependencies (optional)
tower = { version = "0.5", optional = true }
tower-http = { version = "0.7", features = ["cors", "fs", "trace"], optional = true }
uuid = { version = "1.11", features = ["v4"], optional = true }

# Embedded WebUI assets (optional)
rust-embed = { version = "8", features = ["mime-guess"], optional = true }

# Optional TLS-enabled HTTP server for DoH production deployments.
axum-server = { package = "axum-server", version = "0.8", default-features = false, features = ["tls-rustls-no-provider"], optional = true }

[dev-dependencies]
criterion = "0.8"
rcgen = "0.14"
tempfile = "3.24"

[features]
default = ["log-ansi"]
# Enable admin HTTP server
admin = ["axum"]
# Enable cron expression parsing for cron plugin
cron = ["cronexpr", "time/formatting", "time/local-offset", "time/parsing"]
# Enable TLS-backed (DoH using axum-server + rustls) server implementation
doh = ["axum", "axum-server", "rustls", "rustls-pemfile", "tokio-rustls"]
# Enable DoQ (QUIC) server implementation
doq = ["quinn", "rustls", "rustls-pemfile"]
# Enable TLS-backed (DoT using tokio-rustls) server implementation
dot = ["rustls", "rustls-pemfile", "tokio-rustls"]
full = [
  "admin",
  "cron",
  "doh",
  "doq",
  "dot",
  "log-ansi",
  "log-file",
  "metrics",
  "web-embed",
]
# Enable structured logging with lazylog
log = ["lazylog/time"]
# Enable ANSI-colored logging output to terminal
log-ansi = ["lazylog/ansi", "log"]
# Enable logging to file
log-file = ["lazylog/file", "log"]
# Enable metrics endpoint
metrics = ["axum", "prometheus"]
# Enable WebUI server with real-time streaming.
# The `web` feature also enables the audit subsystem (query logging + security
# events via the event bus) automatically; no separate configuration needed.
web = [
  "async-stream",
  "axum",
  "axum/ws",
  "futures-util",
  "time/formatting",
  "time/local-offset",
  "time/macros",
  "tokio/sync",
  "tower",
  "tower-http",
  "uuid",
]
# Enable embedded WebUI assets (compile webui/dist into binary)
web-embed = ["rust-embed", "web"]

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
debug = false
split-debuginfo = "off"
strip = true
lto = true
codegen-units = 1

[profile.test]
opt-level = 1

[profile.full]
inherits = "minimal"

[profile.minimal]
inherits = "release"
opt-level = "z"
panic = "abort"
